<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var css = function(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();};

  /* sticky topbar border-on-scroll */
  var topbar = document.getElementById('topbar');
  addEventListener('scroll', function(){ if(topbar) topbar.classList.toggle('stuck', scrollY > 10); });

  /* card reveal-on-scroll */
  function initReveal(){
    if(REDUCED || !window.gsap || !window.ScrollTrigger){
      document.querySelectorAll('.rv').forEach(function(e){ e.classList.add('in'); });
      return;
    }
    gsap.registerPlugin(ScrollTrigger);
    gsap.utils.toArray('.rv').forEach(function(elm){
      gsap.to(elm,{opacity:1,y:0,duration:.7,ease:'power3.out',scrollTrigger:{trigger:elm,start:'top 90%'}});
    });
    var hero = document.querySelector('.hero-left');
    if(hero) gsap.from(hero,{y:16,opacity:0,duration:.9,ease:'power3.out',delay:.15});
  }

  /* three.js ambient glow, matched to report's warm palette */
  function initGlow(){
    var canvas = document.getElementById('glow');
    if(REDUCED || !window.THREE || !canvas) return;
    var renderer, scene, camera, mat, raf;
    try{ renderer = new THREE.WebGLRenderer({canvas:canvas, alpha:true, antialias:false}); }catch(e){ return; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    scene = new THREE.Scene(); camera = new THREE.Camera();
    var hex = function(v){
      var c = css(v), m = c.match(/\d+\.?\d*/g) || [];
      if(c[0] === '#'){ var n = parseInt(c.slice(1),16); return new THREE.Vector3(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255); }
      return new THREE.Vector3((m[0]||0)/255,(m[1]||0)/255,(m[2]||0)/255);
    };
    var uni = {
      uT:{value:0}, uRes:{value:new THREE.Vector2(1,1)},
      uPaper:{value:hex('--paper')}, uC1:{value:hex('--clay')}, uC2:{value:hex('--amber')}, uC3:{value:hex('--azure')}
    };
    mat = new THREE.ShaderMaterial({uniforms:uni,
      vertexShader:'void main(){gl_Position=vec4(position,1.0);}',
      fragmentShader:'precision highp float;\n'+
        'uniform float uT;uniform vec2 uRes;uniform vec3 uPaper,uC1,uC2,uC3;\n'+
        'float n(vec2 p){return sin(p.x)*sin(p.y);}\n'+
        'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=1.9;p+=vec2(1.3,2.1);a*=.55;}return v;}\n'+
        'void main(){\n'+
        '  vec2 uv=gl_FragCoord.xy/uRes.xy; vec2 p=uv; p.x*=uRes.x/uRes.y;\n'+
        '  float t=uT*0.06;\n'+
        '  float f1=fbm(p*2.2+vec2(t,t*.7));\n'+
        '  float f2=fbm(p*3.1-vec2(t*.8,t));\n'+
        '  float b1=smoothstep(.9,.0,length(p-vec2(uRes.x/uRes.y*0.82,0.9))-f1*.35);\n'+
        '  float b2=smoothstep(.8,.0,length(p-vec2(uRes.x/uRes.y*0.12,0.3))-f2*.4);\n'+
        '  float b3=smoothstep(.75,.0,length(p-vec2(uRes.x/uRes.y*0.5,0.05))-f1*.3);\n'+
        '  vec3 col=uPaper;\n'+
        '  col=mix(col,uC2,clamp(b1*0.45,0.,1.));\n'+
        '  col=mix(col,uC1,clamp(b1*0.28+b3*0.32,0.,1.));\n'+
        '  col=mix(col,uC3,clamp(b2*0.24,0.,1.));\n'+
        '  float grain=fract(sin(dot(gl_FragCoord.xy,vec2(12.9,78.2)))*43758.5)*0.02;\n'+
        '  col+=grain-0.01;\n'+
        '  gl_FragColor=vec4(col,1.0);\n'+
        '}'
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat));
    function size(){ var w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); uni.uRes.value.set(w*renderer.getPixelRatio(),h*renderer.getPixelRatio()); }
    size(); addEventListener('resize', size);
    var t0 = performance.now();
    function loop(){ uni.uT.value=(performance.now()-t0)/1000; renderer.render(scene,camera); raf=requestAnimationFrame(loop); }
    loop();
    document.addEventListener('visibilitychange', function(){ if(document.hidden) cancelAnimationFrame(raf); else loop(); });
    window.updateGlow = function(){ uni.uPaper.value=hex('--paper'); uni.uC1.value=hex('--clay'); uni.uC2.value=hex('--amber'); uni.uC3.value=hex('--azure'); };
  }
  window.updateGlow = window.updateGlow || function(){};

  if(document.readyState === 'complete'){ initReveal(); initGlow(); }
  else addEventListener('load', function(){ initReveal(); initGlow(); });
})();
</script>

<script>
(function(){
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var firstFlag = true;
  function money(n){ return '$' + (n||0).toFixed(2); }
  function updateFlag(range){
    try{
      var list = filterSessions(range);
      var cost=0, tok=0, models={};
      list.forEach(function(s){ cost+=s.cost||0; tok+=s.tok||0; if(s.model) models[s.model]=1; });
      var spanDays = Math.max(1, Math.round((new Date(range.to)-new Date(range.from))/86400000)+1);
      var pFrom = addDays(range.from,-spanDays), pTo = addDays(range.from,-1);
      var pCost = 0;
      SESSIONS.forEach(function(s){ var d2=s.ts.slice(0,10); if(d2>=pFrom&&d2<=pTo) pCost+=s.cost||0; });
      var dEl = el('flagDelta'), nEl = el('flagDeltaNote');
      if(pCost > 0.005){
        var pct = (cost-pCost)/pCost*100;
        dEl.className = 'delta ' + (pct>=0?'up':'down');
        dEl.innerHTML = (pct>=0?'&#8599; ':'&#8600; ') + Math.abs(pct).toFixed(0) + '%';
        nEl.textContent = 'vs prior ' + spanDays + 'd';
      }else{
        dEl.className = 'delta up';
        dEl.innerHTML = '&#8599; new';
        nEl.textContent = 'no prior-period data';
      }
      var last = null;
      list.slice().sort(function(a,b){ return a.ts<b.ts?1:-1; }).some(function(s){ if(s.cost>0){ last=s; return true; } return false; });
      el('flagLast').textContent = last ? ('\u00b7 last session ' + money(last.cost) + ' \u00b7 ' + last.ts.slice(0,10)) : '';
      el('flagSessions').textContent = fmtInt(list.length);
      el('flagTokens').textContent = fmtAbbr(tok);
      el('flagModels').textContent = Object.keys(models).length;
      var ap = document.querySelector('.range-preset.active');
      el('flagRange').textContent = ap ? ap.textContent.toLowerCase() : (range.from + ' \u2192 ' + range.to);
      var fn = el('flagNum');
      if(firstFlag && !REDUCED && window.gsap){
        firstFlag = false;
        var o = {v:0};
        gsap.to(o,{v:cost,duration:1.4,ease:'power2.out',onUpdate:function(){ fn.textContent = money(o.v); }});
      }else{
        firstFlag = false;
        fn.textContent = money(cost);
      }
    }catch(e){}
  }
  var _r = render;
  render = function(range){ _r(range); updateFlag(range); };
  addEventListener('load', function(){
    if(REDUCED || !window.gsap) return;
    var lns = document.querySelectorAll('.term .ln');
    gsap.set(lns,{opacity:0});
    gsap.to(lns,{opacity:1,duration:.3,stagger:.28,ease:'none'});
    var fc = document.querySelector('.flagcard');
    if(fc) gsap.from(fc,{y:18,opacity:0,duration:.9,ease:'power3.out',delay:.25});
  });
})();
</script>
